name: bcl-photo
services:
  studio:
    build: .
    container_name: bcl-photo-studio
    restart: unless-stopped
    ports:
      - "${PHOTO_PORT:-8081}:8000"
    env_file: .env
    volumes:
      - studio-data:/data
    mem_limit: 768m
    cpus: 1.5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  studio-data:
